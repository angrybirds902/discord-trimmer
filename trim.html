<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Trim</title>
<style>
body{font-family:sans-serif;background:#1e1e1e;color:#eee;max-width:720px;margin:40px auto;padding:0 20px}
video{width:100%;background:#000}
input[type=number]{width:90px}
input,button{font-size:14px;padding:6px 10px;margin:4px 2px}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.fmt{font-family:monospace;color:#9cdcfe;min-width:220px}
#liveFmt{font-family:monospace;color:#ce9178}
#log{font-family:monospace;font-size:12px;white-space:pre-wrap;background:#111;padding:10px;max-height:150px;overflow:auto}
</style>
</head>
<body>
<h2>Quick Trim</h2>
<input type="file" id="file" accept="video/*">
<br><br>
<video id="preview" controls></video>
<div class="row">Current: <span id="liveFmt">--</span> &nbsp; FPS: <span id="fpsLabel">?</span></div>

<div class="row">
  Start: <input type="number" id="start" step="0.001" value="0">
  <button id="setStart">set from playhead</button>
  <button id="startBack">« frame</button>
  <button id="startFwd">frame »</button>
  <span class="fmt" id="startFmt"></span>
</div>

<div class="row">
  End: <input type="number" id="end" step="0.001" value="0">
  <button id="setEnd">set from playhead</button>
  <button id="endBack">« frame</button>
  <button id="endFwd">frame »</button>
  <span class="fmt" id="endFmt"></span>
</div>

<br>
<button id="trimBtn">Trim & Export (Discord-ready mp4)</button>
<br><br>
<div id="log"></div>
<a id="download" style="display:none" download="trimmed.mp4"></a>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<script>
const { FFmpeg } = FFmpegWASM;
const { fetchFile } = FFmpegUtil;
const ffmpeg = new FFmpeg();

const log = document.getElementById('log');
let lastLogBuffer = '';
ffmpeg.on('log', ({message}) => {
  lastLogBuffer += message + '\n';
  log.textContent += message + '\n';
  log.scrollTop = log.scrollHeight;
});

const fileInput = document.getElementById('file');
const preview   = document.getElementById('preview');
const startIn   = document.getElementById('start');
const endIn     = document.getElementById('end');
const startFmt  = document.getElementById('startFmt');
const endFmt    = document.getElementById('endFmt');
const liveFmt   = document.getElementById('liveFmt');
const fpsLabel  = document.getElementById('fpsLabel');

let currentFile = null;
let fps = 30; // fallback until detected

async function loadFFmpeg(){
  if(ffmpeg.loaded) return;
  const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';
  await ffmpeg.load({
    coreURL: await FFmpegUtil.toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
    wasmURL: await FFmpegUtil.toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
  });
}

async function detectFPS(file){
  try {
    await loadFFmpeg();
    const name = 'probe' + (file.name.match(/\.\w+$/)?.[0] || '.mp4');
    await ffmpeg.writeFile(name, await fetchFile(file));
    lastLogBuffer = '';
    try { await ffmpeg.exec(['-i', name]); } catch(e) { /* always "fails", that's fine */ }
    const m = lastLogBuffer.match(/(\d+(?:\.\d+)?)\s*fps/);
    if(m) fps = parseFloat(m[1]);
  } catch(e) {
    log.textContent += 'fps detection failed, defaulting to 30\n';
  }
  fpsLabel.textContent = fps.toFixed(2);
  refreshDisplays();
}

function formatTime(seconds, fps){
  if(isNaN(seconds) || seconds < 0) seconds = 0;
  const totalMs = Math.round(seconds * 1000);
  const ms = totalMs % 1000;
  let s = Math.floor(totalMs / 1000);
  const sec = s % 60; s = Math.floor(s / 60);
  const min = s % 60; s = Math.floor(s / 60);
  const hr  = s % 24; s = Math.floor(s / 24);
  const day = s;
  const pad = (n, l=2) => String(n).padStart(l, '0');
  const frame = Math.round(seconds * fps);
  return `${pad(day)}:${pad(hr)}:${pad(min)}:${pad(sec)}:${pad(ms,3)}  (frame ${frame})`;
}

function refreshDisplays(){
  startFmt.textContent = formatTime(parseFloat(startIn.value) || 0, fps);
  endFmt.textContent   = formatTime(parseFloat(endIn.value) || 0, fps);
}

fileInput.onchange = async (e) => {
  currentFile = e.target.files[0];
  preview.src = URL.createObjectURL(currentFile);
  log.textContent += 'detecting frame rate...\n';
  await detectFPS(currentFile);
};

preview.ontimeupdate = () => {
  liveFmt.textContent = formatTime(preview.currentTime, fps);
};

document.getElementById('setStart').onclick = () => {
  startIn.value = preview.currentTime.toFixed(4);
  refreshDisplays();
};
document.getElementById('setEnd').onclick = () => {
  endIn.value = preview.currentTime.toFixed(4);
  refreshDisplays();
};

function nudge(inputEl, dir){
  let v = (parseFloat(inputEl.value) || 0) + dir * (1 / fps);
  if(v < 0) v = 0;
  inputEl.value = v.toFixed(4);
  preview.currentTime = v;
  refreshDisplays();
}

document.getElementById('startBack').onclick = () => nudge(startIn, -1);
document.getElementById('startFwd').onclick  = () => nudge(startIn, 1);
document.getElementById('endBack').onclick   = () => nudge(endIn, -1);
document.getElementById('endFwd').onclick    = () => nudge(endIn, 1);

startIn.oninput = refreshDisplays;
endIn.oninput   = refreshDisplays;

document.getElementById('trimBtn').onclick = async () => {
  if(!currentFile){ alert('pick a file first'); return; }
  const start = parseFloat(startIn.value);
  const end = parseFloat(endIn.value);
  if(!(end > start)){ alert('end must be greater than start'); return; }

  try {
    log.textContent += 'loading ffmpeg...\n';
    await loadFFmpeg();

    const inName = 'input' + (currentFile.name.match(/\.\w+$/)?.[0] || '.mp4');
    await ffmpeg.writeFile(inName, await fetchFile(currentFile));

    log.textContent += 'trimming...\n';
    await ffmpeg.exec([
      '-ss', String(start),
      '-to', String(end),
      '-i', inName,
      '-c:v', 'libx264',
      '-preset', 'veryfast',
      '-crf', '20',
      '-c:a', 'aac',
      '-movflags', '+faststart',
      'output.mp4'
    ]);

    const data = await ffmpeg.readFile('output.mp4');
    const blob = new Blob([data.buffer], {type:'video/mp4'});
    const url = URL.createObjectURL(blob);
    const a = document.getElementById('download');
    a.href = url;
    a.style.display = 'inline-block';
    a.textContent = `Download (${(blob.size/1024/1024).toFixed(2)} MB)`;
    log.textContent += 'done.\n';
  } catch (err) {
    log.textContent += 'ERROR: ' + err.message + '\n';
  }
};
</script>
</body>
</html>
